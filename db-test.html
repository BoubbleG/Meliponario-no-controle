<!doctype html><meta charset="utf-8"><div id="out">RUNNING</div><script src="seed-data.js"></script><script src="db.js"></script><script>
(async()=>{const out=document.getElementById('out');try{await MeliponarioDB.reset();await MeliponarioDB.open();const settings={userName:'Fabrício',defaultApiary:'principal',inspectionInterval:'15',productionUnit:'ml',notifications:true,haptics:true};await MeliponarioDB.seedIfNeeded(MELIPONARIO_SEED,settings);let a=await MeliponarioDB.loadAll();if(a.data.colonies.length!==50) throw new Error('seed count '+a.data.colonies.length);a.data.colonies.push({id:'persist-test',apiaryId:'principal',name:'Teste persistência'});await MeliponarioDB.saveAll(a.data,a.settings);let b=await MeliponarioDB.loadAll();if(!b.data.colonies.some(x=>x.id==='persist-test'))throw new Error('not persisted');await MeliponarioDB.replaceAll(MELIPONARIO_SEED,settings);let c=await MeliponarioDB.loadAll();if(c.data.colonies.length!==50)throw new Error('restore count '+c.data.colonies.length);out.textContent='PASS seed=50 persist=ok restore=50';}catch(e){out.textContent='FAIL '+e.message;console.error(e)}})();
</script>
